[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "major-tom-journal"
version = "0.2.0"
description = "AI-powered local activity journaling system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "watchdog>=3.0.0",
    "pynput>=1.7.6",
    "ollama>=0.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",
]
experiments = [
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
major-tom = "major_tom.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["major_tom"]
omit = ["*/experiments/*", "*/web/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
