# ACM MM Ablation A1: HSR without Semantic Gating
# Tests contribution of Layer 1 (Semantic Gating)

experiment:
  name: "mm_a1_no_semantic"
  dimension: "acmmm_ablation"
  description: "Ablation: HSR without semantic gating layer"
  repeat: 3
  seed: 42

method:
  type: "hsr"
  semantic_threshold: 0.0  # Disabled
  cache_ttl: 300
  history_size: 10

models:
  brain: "qwen3:8b"
  eye: "qwen3-vl:8b"
  embedding: "qwen3-embedding:8b"

components:
  semantic_gating:
    enabled: false  # ABLATED
  decision_cache:
    enabled: true
  vlm:
    enabled: true
  adaptive_sampling:
    enabled: true

metrics:
  collect_all: true
  export_format: "both"
