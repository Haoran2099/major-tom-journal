experiment:
  name: "te_c0_naive"
  dimension: "token_efficiency"
  description: "Naive baseline: every cycle calls LLM Brain + VLM, no optimization layers"
  repeat: 3
  seed: 42

models:
  brain: "qwen3:8b"
  eye: "qwen3-vl:8b"
  embedding: "qwen3-embedding:8b"

components:
  semantic_gating:
    enabled: false
    threshold: 0.30
  decision_cache:
    enabled: false
  vlm:
    enabled: true
    cooldown: 60
    diff_threshold: 0.9
  context_routing:
    enabled: true
    method: "keyword"
  adaptive_sampling:
    enabled: false
  pattern_learning:
    enabled: false

llm_options:
  temperature: 0.1
  num_ctx: 4096
  num_predict: 500

metrics:
  collect_all: true
  export_format: "both"
  export_on_complete: true
