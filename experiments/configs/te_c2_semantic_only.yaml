experiment:
  name: "te_c2_semantic_only"
  dimension: "token_efficiency"
  description: "Semantic-only: semantic gating enabled, no decision cache"
  repeat: 3
  seed: 42

models:
  brain: "qwen3:8b"
  eye: "qwen3-vl:8b"
  embedding: "qwen3-embedding:8b"

components:
  semantic_gating:
    enabled: true
    threshold: 0.30
  decision_cache:
    enabled: false
  vlm:
    enabled: true
    cooldown: 60
    diff_threshold: 0.9
  context_routing:
    enabled: true
    method: "keyword"
  adaptive_sampling:
    enabled: false
  pattern_learning:
    enabled: true

llm_options:
  temperature: 0.1
  num_ctx: 4096
  num_predict: 500

metrics:
  collect_all: true
  export_format: "both"
  export_on_complete: true
