experiment:
  name: "jq_q3_gemma"
  dimension: "journal_quality"
  description: "Gemma models: gemma3:12b + gemma3-vl:12b (different model family)"
  repeat: 3
  seed: 42

models:
  brain: "gemma3:12b"
  eye: "gemma3-vl:12b"
  embedding: "nomic-embed-text"

components:
  semantic_gating:
    enabled: true
    threshold: 0.30
  decision_cache:
    enabled: true
  vlm:
    enabled: true
    cooldown: 60
    diff_threshold: 0.9
  context_routing:
    enabled: true
    method: "keyword"
  adaptive_sampling:
    enabled: true
  pattern_learning:
    enabled: true

llm_options:
  temperature: 0.1
  num_ctx: 4096
  num_predict: 500

metrics:
  collect_all: true
  export_format: "both"
  export_on_complete: true
